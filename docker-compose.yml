services:
  #nama service container database
  postgres-db:
    image: postgres:16-alpine
    container_name: harkat_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superrahasia
      POSTGRES_DB: postgre
    ports:
      #Format postkomputersendiri:postservicecontainer
      - "5433:5432"
    volumes:
      #menyimpan data database
      - postgres_data_volume:/var/lib/postgresql/data

  #service lainnya

volumes:
  postgres_data_volume: